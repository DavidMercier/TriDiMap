[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterlab"
version = "0.1.0"
description = "ICME Multiphase Clustering Toolkit with Streamlit GUI"
readme = "README.md"
requires-python = ">=3.8"

authors = [
  { name="Your Name", email="you@example.com" }
]

license = { text = "MIT" }

dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "xlrd",
    "jsonschema",
    "requests",
]

[project.scripts]
clusterlab = "clustering_app.app_clustering_gui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
